name: smart-query-assistant-demo

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dispatch_demo}
      POSTGRES_USER: ${POSTGRES_USER:-demo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在.env里设置管理员密码}
      DEMO_READER_PASSWORD: ${DEMO_READER_PASSWORD:?请在.env里设置只读帐号密码}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/init/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./db/init/03-security.sh:/docker-entrypoint-initdb.d/03-security.sh:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-demo_admin} -d ${POSTGRES_DB:-dispatch_demo}
      interval: 5s
      timeout: 5s
      retries: 20


  api:
    image: smart-query-api-test
    build:
      context: ./api
      network: host
    restart: unless-stopped
  
    environment:
      DATABASE_URL: postgresql+psycopg://demo_reader:${DEMO_READER_PASSWORD}@postgres:5432/${POSTGRES_DB:-dispatch_demo}
      PLANNER_MODE: ${PLANNER_MODE:-rule}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://192.168.1.100:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b-q4_K_M}
      AUDIT_LOG_PATH: /app/logs/query_audit.jsonl
      APP_TIMEZONE: Asia/Shanghai

    ports:
      - "${API_PORT:-8000}:8000"

    volumes:
      - audit_logs:/app/logs

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12 

volumes:
  postgres_data:
  audit_logs: