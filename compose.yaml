name: smart-query-assistant-demo

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dispatch_demo}
      POSTGRES_USER: ${POSTGRES_USER:-demo_admin}
      POSETGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在.env里设置管理员密码}
      DEMO_READER_PASSWORD: ${DEMO_READER_PASSWORD:?请在.env里设置只读帐号密码}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/init/02-seed.sql:/docker-entrypoint-initdb.d/02-seed-sql:ro
      - ./db/init/03-security.sh:/docker-entrypoint-initdb.d/03-security.sh:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSRGRES_USER:-demo_admin} -d ${POSTGRES_DB:-dispatch_demo}
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
